<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10121d">
  <meta name="description" content="The Crow app: the only key that silences your Crow alarm clock.">
  <title>Crow</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Big+Shoulders+Display:wght@600;800;900&family=VT323&display=swap">
  <link rel="stylesheet" href="css/app.css">
  <style>
    html, body { height: 100%; margin: 0; background: #10121d; }
    [hidden] { display: none !important; }
    #app { position: fixed; top: 0; bottom: 0; left: 0; right: 0; max-width: 480px; margin: 0 auto; }
    #app.crow-app { --ca-top-pad: calc(env(safe-area-inset-top, 0px) + 18px); padding-bottom: env(safe-area-inset-bottom, 0px); }
    #nobt { position: fixed; left: 12px; right: 12px; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); max-width: 456px; margin: 0 auto; z-index: 99;
      background: #5a140a; color: #f3f0e8; border: 1px solid #ff5a3c; border-radius: 14px; padding: 12px 14px;
      font: 14px/1.4 "Atkinson Hyperlegible", system-ui, sans-serif; }
  </style>
</head>
<body>
  <div id="app"></div>
  <p id="nobt" hidden>This browser can't use Bluetooth, so it can't talk to your Crow. On Android use Chrome. On iPhone use the Bluefy browser. On a computer use Chrome or Edge.</p>
  <script type="module" src="js/real.js"></script>
</body>
</html>
